kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ebpf-scale
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30000
    hostPort: 30000
    protocol: TCP
  extraMounts:
  - hostPath: /sys/kernel/btf
    containerPath: /sys/kernel/btf
    readOnly: true
  - hostPath: /lib/modules
    containerPath: /lib/modules
    readOnly: true
- role: worker
  extraMounts:
  - hostPath: /sys/kernel/btf
    containerPath: /sys/kernel/btf
    readOnly: true
  - hostPath: /lib/modules
    containerPath: /lib/modules
    readOnly: true
- role: worker
  extraMounts:
  - hostPath: /sys/kernel/btf
    containerPath: /sys/kernel/btf
    readOnly: true
  - hostPath: /lib/modules
    containerPath: /lib/modules
    readOnly: true
