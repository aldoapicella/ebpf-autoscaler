apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector-ebpf
  namespace: ebpf
  labels:
    app: collector-ebpf
spec:
  selector:
    matchLabels:
      app: collector-ebpf
  template:
    metadata:
      labels:
        app: collector-ebpf
    spec:
      initContainers:
      - name: sysctl-perf
        image: busybox:1.36
        securityContext:
          privileged: true
          capabilities:
            add:
            - BPF
            - PERFMON
          seccompProfile:
            type: Unconfined
        command:
        - sh
        - -c
        - |
          echo -1 > /proc/sys/kernel/perf_event_paranoid
      hostPID: true
      containers:
      - name: collector
        image: collector-ebpf:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add:
            - BPF
            - PERFMON
            - SYS_ADMIN
            - SYS_RESOURCE
          seccompProfile:
            type: Unconfined
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: metrics
          containerPort: 2112
        readinessProbe:
          httpGet:
            path: /healthz
            port: 2112
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: sys-kernel-btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: sys-fs-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: sys-kernel-tracing
          mountPath: /sys/kernel/tracing
          readOnly: true
        - name: sys-fs-bpf
          mountPath: /sys/fs/bpf
      volumes:
      - name: sys-kernel-btf
        hostPath:
          path: /sys/kernel/btf
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: sys-fs-cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: sys-kernel-tracing
        hostPath:
          path: /sys/kernel/tracing
      - name: sys-fs-bpf
        hostPath:
          path: /sys/fs/bpf
