apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector-ebpf
  namespace: ebpf
  labels:
    app: collector-ebpf
spec:
  selector:
    matchLabels:
      app: collector-ebpf
  template:
    metadata:
      labels:
        app: collector-ebpf
    spec:
      hostPID: true
      containers:
      - name: collector
        image: collector-ebpf:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: metrics
          containerPort: 2112
        readinessProbe:
          httpGet:
            path: /healthz
            port: 2112
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: sys-kernel-btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: sys-fs-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
      volumes:
      - name: sys-kernel-btf
        hostPath:
          path: /sys/kernel/btf
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: sys-fs-cgroup
        hostPath:
          path: /sys/fs/cgroup
